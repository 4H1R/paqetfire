name: Windows build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore PaqetFire.slnx -r win-x64
      - name: Test core and Windows boundaries
        run: dotnet test PaqetFire.slnx -c Release -r win-x64 --no-restore
      - name: Build desktop and broker
        run: dotnet build PaqetFire.slnx -c Release --no-restore

  build:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    name: Test and package x64 MSI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Stage verified engine payload
        shell: pwsh
        run: ./scripts/Stage-ReleasePayload.ps1

      - name: Restore solution
        run: dotnet restore PaqetFire.slnx -r win-x64

      - name: Run tests
        run: dotnet test PaqetFire.slnx -c Release -r win-x64 --no-restore

      - name: Publish desktop app
        run: >-
          dotnet publish src/PaqetFire.Desktop/PaqetFire.Desktop.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained true
          --no-restore -o artifacts/publish/win-x64/desktop
          -p:DebugType=None -p:DebugSymbols=false

      - name: Publish broker service
        run: >-
          dotnet publish src/PaqetFire.Broker/PaqetFire.Broker.csproj
          -c Release -r win-x64 --self-contained true
          --no-restore -o artifacts/publish/win-x64/broker
          -p:DebugType=None -p:DebugSymbols=false

      - name: Restore WiX installer
        run: dotnet restore installer/PaqetFire.Installer/PaqetFire.Installer.wixproj

      - name: Build WiX installer
        run: dotnet build installer/PaqetFire.Installer/PaqetFire.Installer.wixproj -c Release --no-restore

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/installer/PaqetFire-*-x64.msi)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one MSI; found $($installers.Count)."
          }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath "$($installers[0].FullName).sha256" -Encoding ascii

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $expectedName = "PaqetFire-$version-x64.msi"
          $installers = @(Get-ChildItem artifacts/installer/PaqetFire-*-x64.msi)
          if ($installers.Count -ne 1 -or $installers[0].Name -ne $expectedName) {
            throw "Release tag $env:GITHUB_REF_NAME does not match installer $($installers.Name)."
          }

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: PaqetFire-windows-x64-${{ github.sha }}
          path: |
            artifacts/installer/PaqetFire-*-x64.msi
            artifacts/installer/PaqetFire-*-x64.msi.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem artifacts/installer/PaqetFire-*-x64.msi | Select-Object -First 1
          $releaseNotes = "docs/releases/$env:GITHUB_REF_NAME.md"
          $notesArguments = if (Test-Path -LiteralPath $releaseNotes) { @('--notes-file', $releaseNotes) } else { @('--generate-notes') }
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            "$($installer.FullName).sha256" `
            --verify-tag `
            @notesArguments `
            --title "PaqetFire $env:GITHUB_REF_NAME"
